<!DOCTYPE html>

<style>

<body>

<button id="clickBtn">Click Here</button>
<button id="backBtn">Go Back</button>
<button id="spaceBtn">Go Through Space</button>
<div id="planetName"></div>
<button id="guideBtn">🌌 Universe Guide</button>
<div id="goto">
    <input id="gotoInput" type="text" placeholder="🔭 Where do you want to go?" autocomplete="off">
    <div id="gotoList"></div>
</div>
<div id="infoCard">
    <div id="infoName"></div>
    <div id="infoType"></div>
    <div id="infoStats"></div>
    <div id="infoText"></div>
    <div class="info-actions">
        <button id="infoMore" class="g-btn fly">Learn more</button>
        <button id="infoTour" class="g-btn tour">🚀 Go through it</button>
    </div>
    <div id="tourProgress"></div>
</div>
<aside id="guide">
    <div class="g-head">
        <h2>Universe Guide</h2>
        <button id="guideClose" class="g-icon-btn">✕</button>
    </div>
    <div id="guideBrowse">
        <input id="guideSearch" type="text" placeholder="Search planets, stars, missions...">
        <div id="guideCats"></div>
        <div class="g-row">
            <span id="guideCount"></span>
            <button id="guideRandom">🎲 Random fact</button>
        </div>
        <div id="guideList"></div>
    </div>
    <div id="guideDetail"></div>
</aside>
<button id="dontClickBtn">Dont Click</button>
<div id="ytBox">
    <button id="closeYt">X</button>
    <iframe id="ytFrame" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>
<div id="photoBox">
    <img id="photo" src="photo.jpg" alt="">
    <p id="caption">Write your text here</p>
</div>

<div id="fileWarning" hidden></div>
<script src="space-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="space-visuals.js"></script>

<script>
const btn = document.getElementById('clickBtn');
const backBtn = document.getElementById('backBtn');
const spaceBtn = document.getElementById('spaceBtn');
const planetName = document.getElementById('planetName');
const photoBox = document.getElementById('photoBox');
let startTour = null;
let space3D = null;
const spaceEvents = {};
let isZooming = false;
let isReturning = false;
let photoShown = false;

function showPhoto() {
    if (photoShown || !isZooming) return;
    photoShown = true;
    photoBox.classList.add('show');
    backBtn.style.display = 'block';
}

btn.addEventListener('click', () => {
    isZooming = true;
    isReturning = false;
    btn.style.display = 'none';
    spaceBtn.style.display = 'none';
    if (typeof THREE === 'undefined') showPhoto();
    else setTimeout(showPhoto, 1500);
});

backBtn.addEventListener('click', () => {
    if (space3D && space3D.isTouring()) {
        backBtn.style.display = 'none';
        space3D.stopTour();
        return;
    }
    isZooming = false;
    photoShown = false;
    photoBox.classList.remove('show');
    backBtn.style.display = 'none';
    if (typeof THREE === 'undefined') btn.style.display = 'block';
    else isReturning = true;
});

spaceBtn.addEventListener('click', () => {
    if (!startTour) return;
    btn.style.display = 'none';
    spaceBtn.style.display = 'none';
    startTour();
});

if (typeof THREE !== 'undefined') {
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 200000);
    camera.position.set(60, 30, 60);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.6;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.03;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.4;

    const SKY = {
        background: 0x03050f,
        faintStars: 30000,
        smallStars: 18000,
        mediumStars: 3500,
        brightStars: 350,
        bandStars: 60000,
        bandGlows: 520,
        bandTilt: 0.55,
        radius: 900
    };

    scene.background = new THREE.Color(SKY.background);

    function skyTexture(stops) {
        const c = document.createElement('canvas');
        c.width = 64;
        c.height = 64;
        const g = c.getContext('2d');
        const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
        stops.forEach(([at, alpha]) => gr.addColorStop(at, 'rgba(255,255,255,' + alpha + ')'));
        g.fillStyle = gr;
        g.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(c);
    }

    const STAR_DOT = skyTexture([[0, 1], [0.2, 0.9], [0.45, 0.25], [1, 0]]);
    const HAZE = skyTexture([[0, 0.55], [0.4, 0.2], [1, 0]]);

    const STAR_COLORS = [
        [0.55, 0.7, 1.0], [0.35, 0.55, 1.0], [0.7, 0.82, 1.0],
        [1.0, 1.0, 1.0], [0.92, 0.95, 1.0],
        [1.0, 0.82, 0.62], [1.0, 0.65, 0.45]
    ];
    const STAR_WEIGHTS = [5, 5, 3, 3, 2, 1, 0.5];

    function pickStarColor() {
        let r = Math.random() * STAR_WEIGHTS.reduce((t, w) => t + w, 0);
        for (let i = 0; i < STAR_COLORS.length; i++) {
            r -= STAR_WEIGHTS[i];
            if (r <= 0) return STAR_COLORS[i];
        }
        return STAR_COLORS[0];
    }

    function skyGauss() {
        return Math.sqrt(-2 * Math.log(Math.random() + 1e-9)) * Math.cos(2 * Math.PI * Math.random());
    }

    const bandU = new THREE.Vector3(-1, -0.45, -1).normalize();
    const bandW = new THREE.Vector3().crossVectors(bandU, new THREE.Vector3(0, 1, 0)).normalize()
        .applyAxisAngle(bandU, SKY.bandTilt);
    const bandN = new THREE.Vector3().crossVectors(bandU, bandW).normalize();

    function bandPoint(lon, lat, r) {
        const a = lon - 0.4;
        return new THREE.Vector3()
            .addScaledVector(bandU, Math.cos(a) * Math.cos(lat))
            .addScaledVector(bandW, Math.sin(a) * Math.cos(lat))
            .addScaledVector(bandN, Math.sin(lat))
            .multiplyScalar(r);
    }

    function dustLane(lon, lat) {
        const center = Math.sin(lon * 2.0) * 0.05 + Math.sin(lon * 5.3 + 1.0) * 0.025;
        const width = 0.035 + 0.02 * Math.sin(lon * 3.1);
        return Math.abs(lat - center) < width;
    }

    function coreBrightness(lon) {
        const d = Math.atan2(Math.sin(lon - 0.4), Math.cos(lon - 0.4));
        return Math.exp(-d * d * 1.6);
    }

    function makeStars(count, size, opacity, radiusJitter) {
        const pos = new Float32Array(count * 3);
        const cols = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = SKY.radius * (1 - Math.random() * radiusJitter);
            pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            pos[i * 3 + 2] = r * Math.cos(phi);
            const c = pickStarColor();
            const dim = 0.8 + Math.random() * 0.6;
            cols[i * 3] = c[0] * dim;
            cols[i * 3 + 1] = c[1] * dim;
            cols[i * 3 + 2] = c[2] * dim;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
        return new THREE.Points(geo, new THREE.PointsMaterial({
            size, sizeAttenuation: false, map: STAR_DOT, vertexColors: true, transparent: true, opacity,
            depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false
        }));
    }

    function makeBandStars() {
        const pos = [];
        const cols = [];
        for (let i = 0; i < SKY.bandStars; i++) {
            const lon = Math.random() * Math.PI * 2;
            const core = coreBrightness(lon);
            const lat = skyGauss() * (0.09 + core * 0.06);
            if (dustLane(lon, lat) && Math.random() < 0.85) continue;
            const p = bandPoint(lon, lat, SKY.radius * (0.92 + Math.random() * 0.06));
            pos.push(p.x, p.y, p.z);
            const warm = core * (1 - Math.min(1, Math.abs(lat) * 6));
            const c = Math.random() < warm * 0.8
                ? [1.0, 0.72 + Math.random() * 0.15, 0.55 + Math.random() * 0.2]
                : pickStarColor();
            const dim = 0.6 + Math.random() * 0.6 + core * 0.3;
            cols.push(c[0] * dim, c[1] * dim, c[2] * dim);
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
        return new THREE.Points(geo, new THREE.PointsMaterial({
            size: 2.4, sizeAttenuation: false, map: STAR_DOT, vertexColors: true, transparent: true, opacity: 0.9,
            depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false
        }));
    }

    function makeBandHaze() {
        const group = new THREE.Group();
        const hazeColors = [0x5a3a7a, 0x7a4a5a, 0x8a5a3a, 0x3a4a8a, 0x6a5a8a, 0xa06040];
        for (let i = 0; i < SKY.bandGlows; i++) {
            const lon = Math.random() * Math.PI * 2;
            const core = coreBrightness(lon);
            const lat = skyGauss() * (0.06 + core * 0.04);
            if (dustLane(lon, lat)) continue;
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: HAZE,
                color: hazeColors[Math.floor(Math.random() * (core > 0.5 ? 6 : 5))],
                transparent: true,
                opacity: 0.12 + core * 0.16,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                toneMapped: false
            }));
            sprite.position.copy(bandPoint(lon, lat, SKY.radius * 0.97));
            const size = 90 + Math.random() * 140 + core * 110;

    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
    float snoise(vec3 v) {
        const vec2 C = vec2(1.0/6.0, 1.0/3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(
                    i.z + vec4(0.0, i1.z, i2.z, 1.0))
                + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0) * 2.0 + 1.0;
        vec4 s1 = floor(b1) * 2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
    }
    `;

    function makeMilkyWay() {
        const group = new THREE.Group();
        const pos = new Float32Array(GALAXY.points * 3);
        const cols = new Float32Array(GALAXY.points * 3);
        const R = GALAXY.radius;
        const core = new THREE.Color('#ffd9a0');
        const arm = new THREE.Color('#9ec0ff');
        const pink = new THREE.Color('#ff8fc0');
        const c = new THREE.Color();
        const base = Math.atan2(-toCenterDir.z, -toCenterDir.x);
        for (let i = 0; i < GALAXY.points; i++) {
            let x;
            let y;
            let z;
            const roll = Math.random();
            if (roll < 0.22) {
                const r = Math.abs(skyGauss()) * R * 0.12;
                const a = Math.random() * Math.PI * 2;
                x = Math.cos(a) * r * 1.6;
                z = Math.sin(a) * r;
                y = skyGauss() * R * 0.05 * Math.exp(-r / (R * 0.15));
                c.copy(core).multiplyScalar(0.6 + Math.random() * 0.5);
            } else {
                const r = R * (0.12 + Math.pow(Math.random(), 0.85) * 0.88);
                const armIndex = Math.floor(Math.random() * GALAXY.arms);
                const a = base + armIndex * (Math.PI * 2 / GALAXY.arms) + Math.log(r / (R * 0.12)) * 1.9 + skyGauss() * (roll < 0.85 ? 0.12 : 0.6);
                x = Math.cos(a) * r;
                z = Math.sin(a) * r;
                y = skyGauss() * R * 0.012;
                const t = r / R;
                c.copy(core).lerp(arm, Math.min(1, t * 1.6));
                if (Math.random() < 0.05) c.copy(pink);
                c.multiplyScalar(0.35 + Math.random() * 0.45);
            }
            pos[i * 3] = x;
            pos[i * 3 + 1] = y;
            pos[i * 3 + 2] = z;
            cols[i * 3] = c.r;
            cols[i * 3 + 1] = c.g;
            cols[i * 3 + 2] = c.b;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
        group.add(new THREE.Points(geo, new THREE.PointsMaterial({
            size: 2.6, sizeAttenuation: false, map: STAR_DOT, vertexColors: true, transparent: true, opacity: 0.9,
            depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false
        })));
        const bulge = new THREE.Sprite(new THREE.SpriteMaterial({
            map: HAZE, color: 0xffc070, transparent: true, opacity: 0.55,
            depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false
        }));
        bulge.scale.set(R * 0.6, R * 0.6, 1);
        const glowGroup = new THREE.Group();
        glowGroup.add(bulge);
        for (let i = 0; i < 260; i++) {
            const r = R * (0.15 + Math.random() * 0.8);
            const armIndex = Math.floor(Math.random() * GALAXY.arms);
            const a = base + armIndex * (Math.PI * 2 / GALAXY.arms) + Math.log(r / (R * 0.12)) * 1.9 + skyGauss() * 0.1;
            const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({

                depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false

            glowSprite.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
            const size = R * (0.08 + Math.random() * 0.08);
            glowSprite.scale.set(size, size, 1);
            glowGroup.add(glowSprite);
        }
        group.add(glowGroup);
        group.userData.glow = glowGroup;
        group.position.copy(GALAXY_CENTER);
        return group;
    }

            } else if (OUTSIDE_MILKY_WAY[item.id]) {

                deepCount++;

                offset = toSun.multiplyScalar(built.size * 2.3).addScaledVector(up, built.size * 0.7);
            } else if (built.region) {

    const ROUND_DOT = (() => {

    function gaussRand() {
        return Math.sqrt(-2 * Math.log(Math.random() + 1e-9)) * Math.cos(2 * Math.PI * Math.random());
    }

    function buildPhotoModel(img, info, stop) {
        const W = img.width;
        const H = img.height;
        const source = document.createElement('canvas');
        source.width = W;
        source.height = H;
        const sg = source.getContext('2d');
        sg.drawImage(img, 0, 0);
        const data = sg.getImageData(0, 0, W, H).data;

        const dustAt = new Float32Array(W * H);
        for (let i = 0; i < W * H; i++) {
            const r = data[i * 4] / 255;
            const g = data[i * 4 + 1] / 255;
            const b = data[i * 4 + 2] / 255;
            const lum = 0.3 * r + 0.59 * g + 0.11 * b;
            const warm = Math.max(0, r - b);
            dustAt[i] = Math.min(1, Math.max((0.36 - lum) / 0.24, warm * (info.warm === undefined ? 1.8 : info.warm)));
        }

        const blurred = new Float32Array(W * H);
        const rad = 2;
        for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
                let sum = 0;
                let n = 0;
                for (let dy = -rad; dy <= rad; dy++) {
                    for (let dx = -rad; dx <= rad; dx++) {
                        const xx = x + dx;
                        const yy = y + dy;
                        if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
                        sum += dustAt[yy * W + xx];
                        n++;
                    }
                }
                blurred[y * W + x] = sum / n;
            }
        }

        function layerTexture(alphaFor, brighten) {
            const c = document.createElement('canvas');
            c.width = W;
            c.height = H;
            const g = c.getContext('2d');
            const out = g.createImageData(W, H);
            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    const i = y * W + x;
                    out.data[i * 4] = Math.min(255, data[i * 4] * brighten);
                    out.data[i * 4 + 1] = Math.min(255, data[i * 4 + 1] * brighten);
                    out.data[i * 4 + 2] = Math.min(255, data[i * 4 + 2] * brighten);
                    out.data[i * 4 + 3] = Math.round(255 * Math.min(1, Math.max(0, alphaFor(x, y, i))));
                }
            }
            g.putImageData(out, 0, 0);
            const t = new THREE.CanvasTexture(c);
            t.encoding = THREE.sRGBEncoding;
            return t;
        }

        function edgeFade(x, y) {
            const d = Math.hypot((x / W - 0.5) * 2, (y / H - 0.5) * 2);
            return Math.max(0, 1 - Math.pow(Math.max(0, d - 0.45) / 0.55, 1.5));
        }

        const height = stop.size * info.scale;
        const width = height * W / H;
        const depth = width * info.depth;
        const holder = new THREE.Group();

        function addLayer(texture, z, scale, opacity, additive) {
            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(width * scale, height * scale),
                new THREE.MeshBasicMaterial({
                    map: texture, transparent: true, opacity, depthWrite: false, side: THREE.DoubleSide,
                    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending, toneMapped: false
                })
            );
            mesh.position.z = z;
            holder.add(mesh);
        }

        if (info.mode === 'cloud') {
            const lumAt = new Float32Array(W * H);
            for (let i = 0; i < W * H; i++) {
                lumAt[i] = (0.3 * data[i * 4] + 0.59 * data[i * 4 + 1] + 0.11 * data[i * 4 + 2]) / 255;
            }
            const glowAt = new Float32Array(W * H);
            const gr = 3;
            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    let sum = 0;
                    let n = 0;
                    for (let dy = -gr; dy <= gr; dy += 1) {
                        for (let dx = -gr; dx <= gr; dx += 1) {
                            const xx = x + dx;
                            const yy = y + dy;
                            if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
                            sum += lumAt[yy * W + xx];
                            n++;
                        }
                    }
                    glowAt[y * W + x] = sum / n;
                }
            }
            addLayer(layerTexture((x, y) => edgeFade(x, y), 1.15), -depth, 1.35, 1, false);
            const slices = 12;
            for (let k = 0; k < slices; k++) {
                const t = k / (slices - 1);
                const threshold = 0.12 + t * 0.45;
                addLayer(layerTexture((x, y, i) => (glowAt[i] - threshold) / 0.18 * Math.min(1, edgeFade(x, y) * 1.5), 1.15 + t * 0.15),
                    -depth * 0.6 + t * depth * 0.8, 1 - t * 0.02, 0.4, false);
            }
            addLayer(layerTexture((x, y, i) => (lumAt[i] - 0.8) / 0.15, 1.3), depth * 0.5, 1, 1, true);
        } else if (info.mode === 'ring') {
            let cx = 0;
            let cy = 0;
            let mass = 0;
            const lumAt = new Float32Array(W * H);
            for (let i = 0; i < W * H; i++) {
                lumAt[i] = (0.3 * data[i * 4] + 0.59 * data[i * 4 + 1] + 0.11 * data[i * 4 + 2]) / 255;
                if (lumAt[i] > 0.45) {
                    cx += i % W;
                    cy += Math.floor(i / W);
                    mass++;
                }
            }
            cx /= mass;
            cy /= mass;
            const radii = [];
            for (let i = 0; i < W * H; i++) {
                if (lumAt[i] > 0.45) radii.push(Math.hypot(i % W - cx, Math.floor(i / W) - cy));
            }
            radii.sort((p, q) => p - q);
            const R = radii[Math.floor(radii.length * 0.92)];
            const radAt = (x, y) => Math.hypot(x - cx, y - cy) / R;
            const clamp01 = (v) => Math.min(1, Math.max(0, v));

            const smoothLum = new Float32Array(W * H);
            const sr = 4;
            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    let sum = 0;
                    let n = 0;
                    for (let dy = -sr; dy <= sr; dy += 2) {
                        for (let dx = -sr; dx <= sr; dx += 2) {
                            const xx = x + dx;
                            const yy = y + dy;
                            if (xx < 0 || yy < 0 || xx >= W || yy >= H) continue;
                            sum += lumAt[yy * W + xx];
                            n++;
                        }
                    }
                    smoothLum[y * W + x] = sum / n;
                }
            }
            const ringAt = new Float32Array(W * H);
            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    const i = y * W + x;
                    const r = radAt(x, y);
                    const band = clamp01(1 - Math.abs(r - 0.82) / 0.35);
                    const isStar = lumAt[i] - smoothLum[i] > 0.12;
                    ringAt[i] = isStar ? 0 : clamp01((smoothLum[i] - 0.22) / 0.3) * band;
                }
            }

            addLayer(layerTexture((x, y) => edgeFade(x, y) * clamp01((radAt(x, y) - 0.85) / 0.35), 1.15), -depth * 1.1, 1.35, 1, false);
            addLayer(layerTexture((x, y, i) => {
                const r = radAt(x, y);
                const red = Math.max(0, data[i * 4] - data[i * 4 + 2]) / 255;
                return edgeFade(x, y) * clamp01((r - 0.9) / 0.2) * clamp01(1.6 - r) * red * 2;
            }, 1.3), -depth * 0.55, 1.08, 0.9, true);
            addLayer(layerTexture((x, y) => clamp01((0.8 - radAt(x, y)) / 0.15), 1.25), -depth * 0.5, 1, 1, false);
            const slices = 14;
            for (let k = 0; k < slices; k++) {
                const t = k / (slices - 1);
                const threshold = 0.16 + Math.abs(t - 0.5) * 0.5;
                addLayer(layerTexture((x, y, i) => (ringAt[i] - threshold) / 0.3, 1.2), (t - 0.5) * depth, 1 - Math.abs(t - 0.5) * 0.06, 0.6, false);
            }
            addLayer(layerTexture((x, y, i) => {
                const r = radAt(x, y);
                return (r < 0.6 || r > 1.05) ? (lumAt[i] - 0.7) / 0.2 : 0;
            }, 1.4), depth * 0.7, 1, 1, true);
        } else {
            addLayer(layerTexture((x, y) => edgeFade(x, y), 1.2), -depth, 1.35, 1, false);
            addLayer(layerTexture((x, y, i) => edgeFade(x, y) * (1 - blurred[i]) * 0.5, 1.4), -depth * 0.45, 1.12, 0.6, true);
            const slices = 5;
            for (let k = 0; k < slices; k++) {
                const threshold = 0.35 + k * 0.1;
                const tex = layerTexture((x, y, i) => (blurred[i] - threshold) / 0.12 * Math.min(1, edgeFade(x, y) * 1.6), 1.25 - k * 0.04);
                addLayer(tex, -depth * 0.2 + (k / (slices - 1)) * depth * 0.55, 1 - k * 0.012, 1, false);
            }
            addLayer(layerTexture((x, y, i) => {
                const lum = (data[i * 4] + data[i * 4 + 1] + data[i * 4 + 2]) / 765;
                return (lum - 0.75) / 0.2;
            }, 1.3), depth * 0.6, 1, 1, true);
        }

        stop.obj.children.forEach((child) => {
            if (!child.userData.itemId) child.visible = false;
        });
        stop.obj.add(holder);

        const facing = new THREE.Vector3();
        updaters.push((time) => {
            stop.obj.getWorldPosition(facing).add(stop.offset);
            holder.lookAt(facing);
            holder.rotateY(Math.sin(time * 0.3) * 0.22);
        });
    }

    function diskTexture(style, hot) {
        return canvasTexture(1024, (g, n) => {
            const c = n / 2;
            const fiery = style === 'fiery';
            const grad = g.createRadialGradient(c, c, 0, c, c, c);
            const inner = fiery ? 0.12 : 0.3;
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(inner * 0.97, 'rgba(0,0,0,0)');
            grad.addColorStop(inner, 'rgba(255,255,245,1)');
            grad.addColorStop(inner + 0.08, hot ? 'rgba(255,250,220,1)' : 'rgba(255,236,170,1)');
            grad.addColorStop(fiery ? 0.45 : 0.55, 'rgba(255,160,50,0.95)');
            grad.addColorStop(fiery ? 0.75 : 0.85, 'rgba(200,60,15,0.6)');
            grad.addColorStop(1, 'rgba(90,15,5,0)');
            g.fillStyle = grad;
            g.fillRect(0, 0, n, n);
            g.globalCompositeOperation = 'lighter';
            for (let i = 0; i < (fiery ? 900 : 500); i++) {
                const r = c * (inner + Math.random() * (1 - inner) * (fiery ? 0.95 : 0.8));
                const a0 = Math.random() * Math.PI * 2;
                const len = fiery ? 0.4 + Math.random() * 1.6 : 0.8 + Math.random() * 3;
                const t = (r / c - inner) / (1 - inner);
                const alpha = (1 - t) * (fiery ? 0.18 : 0.12) * Math.random();
                g.strokeStyle = t < 0.25 ? `rgba(255,245,210,${alpha})` : `rgba(255,${Math.round(150 - t * 90)},40,${alpha})`;
                g.lineWidth = 1 + Math.random() * (fiery ? 5 : 2.5);
                g.beginPath();
                if (fiery) {
                    for (let k = 0; k <= 20; k++) {
                        const a = a0 + (k / 20) * len;
                        const rr = r * (1 - (k / 20) * 0.12);
                        k ? g.lineTo(c + Math.cos(a) * rr, c + Math.sin(a) * rr) : g.moveTo(c + Math.cos(a) * rr, c + Math.sin(a) * rr);
                    }
                } else {
                    g.arc(c, c, r, a0, a0 + len);
                }
                g.stroke();
            }
            if (fiery) {
                for (let i = 0; i < 160; i++) {
                    const r = c * (0.3 + Math.random() * 0.65);
                    const a = Math.random() * Math.PI * 2;
                    g.fillStyle = `rgba(${Math.random() < 0.5 ? '120,20,5' : '60,8,2'},${0.15 + Math.random() * 0.25})`;
                    g.globalCompositeOperation = 'source-atop';
                    g.beginPath();
                    g.ellipse(c + Math.cos(a) * r, c + Math.sin(a) * r, 8 + Math.random() * 30, 3 + Math.random() * 10, a + Math.PI / 2, 0, Math.PI * 2);
                    g.fill();
                }
            }
        });
    }

    function haloTexture() {
        return canvasTexture(512, (g, n) => {
            const c = n / 2;
            const grad = g.createRadialGradient(c, c, 0, c, c, c);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(0.42, 'rgba(0,0,0,0)');
            grad.addColorStop(0.44, 'rgba(255,255,240,1)');
            grad.addColorStop(0.5, 'rgba(255,238,190,0.95)');
            grad.addColorStop(0.68, 'rgba(255,170,70,0.55)');
            grad.addColorStop(1, 'rgba(160,50,10,0)');
            g.fillStyle = grad;
            g.fillRect(0, 0, n, n);
            g.globalCompositeOperation = 'lighter';
            for (let i = 0; i < 120; i++) {
                const r = c * (0.45 + Math.random() * 0.35);
                g.strokeStyle = `rgba(255,220,160,${Math.random() * 0.15})`;
                g.lineWidth = 1 + Math.random() * 2;
                g.beginPath();
                g.arc(c, c, r, 0, Math.PI * 2);
                g.stroke();
            }
        });
    }

    function glowTexture() {
        return canvasTexture(128, (g, n) => {
            const grad = g.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
            grad.addColorStop(0, 'rgba(255,200,120,0.9)');
            grad.addColorStop(0.3, 'rgba(255,130,40,0.35)');
            grad.addColorStop(1, 'rgba(255,90,20,0)');
            g.fillStyle = grad;
            g.fillRect(0, 0, n, n);
        });
    }

    const BH_GLOW = glowTexture();
    const BH_HALO = haloTexture();

    function additive(map, opacity = 1) {
        return new THREE.MeshBasicMaterial({
            map, transparent: true, opacity, side: THREE.DoubleSide,
            depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false
        });
    }

    function makeBlackHole(r, opts) {
        const group = new THREE.Group();
        const updates = [];
        const style = opts.style;

        const horizon = new THREE.Mesh(new THREE.SphereGeometry(r, 48, 32), new THREE.MeshBasicMaterial({ color: 0x000000 }));
        horizon.renderOrder = 2;
        group.add(horizon);

        if (style !== 'quiet') {
            const outer = style === 'fiery' ? r * 11 : r * 5.2;
            const disk = new THREE.Mesh(new THREE.RingGeometry(outer * (style === 'fiery' ? 0.12 : 0.3), outer, 160, 1), additive(diskTexture(style, opts.hot)));
            disk.rotation.x = -Math.PI / 2;
            group.add(disk);
            const spin = style === 'fiery' ? 0.05 : 0.12;
            updates.push((t) => { disk.rotation.z = t * spin; });

            const glow = new THREE.Sprite(new THREE.SpriteMaterial({
                map: BH_GLOW, transparent: true, opacity: style === 'fiery' ? 0.55 : 0.45,
                depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false
            }));
            glow.scale.set(outer * 1.6, outer * 1.6, 1);
            group.add(glow);
        }

        const halo = new THREE.Mesh(
            new THREE.RingGeometry(r * 1.02, style === 'quiet' ? r * 1.6 : r * 2.6, 128, 1),
            additive(BH_HALO, style === 'quiet' ? 0.35 : 0.95)
        );
        halo.renderOrder = 3;
        group.add(halo);

        const holderPos = new THREE.Vector3();
        updates.push(() => {
            halo.getWorldPosition(holderPos);
            halo.lookAt(camera.position);
        });

        if (opts.jet) {
            for (const dir of [1, -1]) {
                const jet = new THREE.Mesh(
                    new THREE.CylinderGeometry(r * 0.04, r * 0.3, r * 22, 16, 1, true),
                    new THREE.MeshBasicMaterial({ color: 0x7fa8ff, transparent: true, opacity: 0.12, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false, side: THREE.DoubleSide })
                );
                jet.position.y = dir * r * 11.5;
                if (dir < 0) jet.rotation.x = Math.PI;
                group.add(jet);
            }
        }

        if (opts.companion) {
            const star = new THREE.Mesh(new THREE.SphereGeometry(r * 0.9, 32, 16), new THREE.MeshBasicMaterial({ color: opts.companion, toneMapped: false }));
            const starGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: BH_GLOW, color: opts.companion, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }));
            starGlow.scale.set(r * 6, r * 6, 1);
            star.add(starGlow);
            group.add(star);
            updates.push((t) => star.position.set(Math.cos(t * 0.15) * r * 9, r * 0.5, Math.sin(t * 0.15) * r * 9));
        }

        return { group, update: (t) => updates.forEach((u) => u(t)) };
    }

    function lensStarTexture() {
        const t = canvasTexture(1024, (g, n) => {
            g.fillStyle = '#0b0907';
            g.fillRect(0, 0, n, n);
            for (let i = 0; i < 140; i++) {
                const x = Math.random() * n;
                const y = n * 0.55 + (Math.random() - 0.5) * n * 0.5 + (x - n / 2) * 0.35;
                const r = 40 + Math.random() * 120;
                const grad = g.createRadialGradient(x, y, 0, x, y, r);
                const tone = Math.random() < 0.5 ? '120,100,80' : '90,75,62';
                grad.addColorStop(0, `rgba(${tone},0.16)`);
                grad.addColorStop(1, `rgba(${tone},0)`);
                g.fillStyle = grad;
                g.fillRect(x - r, y - r, r * 2, r * 2);
            }
            for (let i = 0; i < 60; i++) {
                const x = Math.random() * n;
                const y = n * 0.55 + (Math.random() - 0.5) * n * 0.3 + (x - n / 2) * 0.35;
                g.fillStyle = 'rgba(10,6,4,0.35)';
                g.beginPath();
                g.ellipse(x, y, 20 + Math.random() * 60, 6 + Math.random() * 18, Math.random() * Math.PI, 0, Math.PI * 2);
                g.fill();
            }
            const colors = ['255,255,255', '255,240,210', '255,210,150', '255,180,110', '200,220,255', '160,190,255'];
            for (let i = 0; i < 16000; i++) {
                const x = Math.random() * n;
                const y = Math.random() * n;
                const big = Math.random() < 0.012;
                const r = big ? 1.4 + Math.random() * 1.8 : 0.4 + Math.random() * 0.9;
                const c = colors[Math.floor(Math.random() * colors.length)];
                if (big) {
                    const grad = g.createRadialGradient(x, y, 0, x, y, r * 4);
                    grad.addColorStop(0, `rgba(${c},0.9)`);
                    grad.addColorStop(1, `rgba(${c},0)`);
                    g.fillStyle = grad;
                    g.fillRect(x - r * 4, y - r * 4, r * 8, r * 8);
                }
                g.fillStyle = `rgba(${c},${0.35 + Math.random() * 0.65})`;
                g.beginPath();
                g.arc(x, y, r, 0, Math.PI * 2);
                g.fill();
            }
        });
        t.wrapS = THREE.RepeatWrapping;
        t.wrapT = THREE.RepeatWrapping;
        return t;
    }

    function makeLensedMerger(size) {
        const material = new THREE.ShaderMaterial({
            uniforms: {
                uStars: { value: lensStarTexture() },
                uA: { value: new THREE.Vector2() },
                uB: { value: new THREE.Vector2() },
                uEa: { value: 0.15 },
                uEb: { value: 0.135 },
                uHa: { value: 0.085 },
                uHb: { value: 0.075 }
            },
            vertexShader: `
                varying vec2 vP;
                void main() {
                    vP = uv * 2.0 - 1.0;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D uStars;
                uniform vec2 uA;
                uniform vec2 uB;
                uniform float uEa;
                uniform float uEb;
                uniform float uHa;
                uniform float uHb;
                varying vec2 vP;
                void main() {
                    vec2 p = vP;
                    float edge = length(p);
                    if (edge > 1.0) discard;
                    vec2 da = p - uA;
                    vec2 db = p - uB;
                    float ra = length(da);
                    float rb = length(db);
                    float fade = smoothstep(1.0, 0.55, edge);
                    if (ra < uHa || rb < uHb) {
                        gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
                        return;
                    }
                    vec2 src = p - uEa * uEa * da / (ra * ra) - uEb * uEb * db / (rb * rb);
                    vec3 col = texture2D(uStars, src * 0.85 + 0.5).rgb;
                    float glowA = exp(-pow((ra - uHa) / (uHa * 0.12), 2.0));
                    float glowB = exp(-pow((rb - uHb) / (uHb * 0.12), 2.0));
                    col += vec3(1.0, 0.9, 0.75) * (glowA + glowB) * 0.2;
                    float bend = clamp((uEa * uEa / (ra * ra) + uEb * uEb / (rb * rb)) * 0.6, 0.0, 1.0);
                    float alpha = max(fade, bend);
                    gl_FragColor = vec4(col * 1.25, alpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide
        });
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(size, size), material);
        plane.renderOrder = 5;
        const update = (t) => {
            const angle = t * 0.9;
            const ax = Math.cos(angle) * 0.13;
            const ay = Math.sin(angle) * 0.1;
            material.uniforms.uA.value.set(ax, ay);
            material.uniforms.uB.value.set(-ax * 1.24, -ay * 1.24);
            plane.lookAt(camera.position);
        };
        return { plane, update };
    }

    Object.entries(BLACK_HOLE_MODELS).forEach(([id, opts]) => {
        const stop = stops[id];
        if (!stop) return;
        const dist = stop.offset.length();
        const r = dist * (opts.style === 'fiery' ? 0.03 : 0.05);
        const root = new THREE.Group();
        stop.obj.getWorldPosition(root.position);
        scene.add(root);

        const side = stop.offset.clone().setY(0);
        if (side.lengthSq() < 1e-6) side.set(1, 0, 0);
        side.normalize();
        const lift = opts.style === 'fiery' ? 0.3 : opts.style === 'merger' ? 0.25 : 0.12;
        stop.offset.copy(side).multiplyScalar(dist * Math.cos(lift)).addScaledVector(up, dist * Math.sin(lift));
        if (opts.style === 'fiery') {
            root.quaternion.setFromAxisAngle(side, 0.35);
        }

        if (opts.style === 'merger') {
            const merger = makeLensedMerger(dist * 1.5);
            root.add(merger.plane);
            updaters.push(merger.update);
        } else if (opts.pair) {
            const a = makeBlackHole(r * 0.55, opts);
            const b = makeBlackHole(r * 0.45, opts);
            root.add(a.group);
            root.add(b.group);
            updaters.push((t) => {
                const angle = t * 0.8;
                a.group.position.set(Math.cos(angle) * r * 2.4, 0, Math.sin(angle) * r * 2.4);
                b.group.position.set(-Math.cos(angle) * r * 2.9, 0, -Math.sin(angle) * r * 2.9);
                a.update(t);
                b.update(t);
            });
        } else {
            const bh = makeBlackHole(r, opts);
            root.add(bh.group);
            updaters.push(bh.update);
        }

        stop.obj.children.forEach((child) => {
            if (!child.userData.itemId) child.visible = false;
        });
        if (stop.obj.isMesh) stop.obj.material.visible = false;
    });

    const TOUR = ['sun', 'mercury', 'venus', 'earth', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune'];

    const GALAXY_SHAPES = {

    const MILKY_WAY_TOUR = Object.keys(IN_MILKY_WAY).concat(['sun', 'earth']);
    const GROUP_TOURS = { 'local-group': ['milky-way', 'lmc', 'smc', 'andromeda', 'triangulum'] };

    function makeGalaxyRoute(id) {
        const stop = stops[id];
        const item = typeof SpaceDB !== 'undefined' ? SpaceDB.get(id) : null;
        const route = REGION_ROUTES[GALAXY_SHAPES[id]];
        if (!stop || !item || !route) return [];
        const facts = [item.summary, ...item.facts];
        const size = stop.size;
        const list = [];
        const used = new Set();
        route.forEach((part) => {
            const wid = id + '--' + part.key;
            if (!stops[wid]) {
                const marker = new THREE.Object3D();
                marker.position.set(Math.cos(part.a) * part.r * size * 0.9, part.y * size, Math.sin(part.a) * part.r * size * 0.9);
                stop.obj.add(marker);
                const view = part.key === 'core' ? 0.22 : 0.16;
                addStop(wid, marker, new THREE.Vector3(size * view * 0.6, size * view * 0.45, size * view), size * view * 0.5);
                stops[wid].label = item.name + ': ' + part.name;
                let text = part.text;
                if (!text) {
                    const fact = facts[part.fact];
                    text = fact && !used.has(fact) ? fact : part.alt;
                    if (fact === text) used.add(fact);
                }
                stops[wid].text = text;
                stops[wid].galaxy = id;
            }
            list.push(wid);
            const members = GALAXY_MEMBERS[id];
            if (members && members.after === part.key) {
                members.ids.filter((m) => stops[m]).forEach((m) => list.push(m));
            }
        });
        return list;
    }

    function shortestRoute(start, ids) {
        const left = ids.filter((x) => stops[x] && x !== start);
        const route = [start];
        const here = new THREE.Vector3();
        const there = new THREE.Vector3();
        while (left.length) {
            stops[route[route.length - 1]].obj.getWorldPosition(here);
            let best = 0;
            let bestDist = Infinity;
            left.forEach((x, i) => {
                const d = stops[x].obj.getWorldPosition(there).distanceTo(here);
                if (d < bestDist) {
                    bestDist = d;
                    best = i;
                }
            });
            route.push(left.splice(best, 1)[0]);
        }
        return route;
    }

    function galaxyTourList(id) {
        if (id === 'milky-way') return ['milky-way', ...shortestRoute('sgr-a', MILKY_WAY_TOUR), 'milky-way'];
        if (GROUP_TOURS[id]) return [id, ...GROUP_TOURS[id].filter((x) => stops[x]), id];
        const route = makeGalaxyRoute(id);
        return route.length ? [id, ...route, id] : null;
    }

    const GALAXY_TOURS = { 'milky-way': true, 'local-group': true };
    Object.keys(GALAXY_SHAPES).forEach((g) => { GALAXY_TOURS[g] = true; });

        if (stops[id] && stops[id].label) return stops[id].label;

    space3D = {

        galaxyTour(id) {
            const list = galaxyTourList(id);
            if (list) runStops(list, false, { endStay: true, hold: 5.5, name: id });
        },
        tourInfo: () => (touring && tourName ? { name: tourName, index: tourIndex, total: tourList.length } : null),
        stopInfo: (id) => stops[id] || null,
        pause() {
            if (touring && !stayAtEnd) {
                tourName = null;
                tourList = [tourList[tourIndex]];
                tourIndex = 0;
                stayAtEnd = true;
            }
        },
        stopTour() {
            touring = false;
            isReturning = true;
            planetName.classList.remove('show');
            if (spaceEvents.onLeave) spaceEvents.onLeave();
        }
    };

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let downX = 0;
    let downY = 0;

    renderer.domElement.addEventListener('pointerdown', (e) => {
        downX = e.clientX;
        downY = e.clientY;
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
        if (Math.hypot(e.clientX - downX, e.clientY - downY) > 5 || !spaceEvents.onPick) return;
        pointer.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.intersectObjects(pickables, false).find((h) => h.object.visible);
        if (hit) spaceEvents.onPick(hit.object.userData.itemId);
    });

    const zoomTarget = new THREE.Vector3(0, 0, 10);
    const startPos = new THREE.Vector3(60, 30, 60);
    const center = new THREE.Vector3(0, 0, 0);
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        diskMaterial.uniforms.uTime.value = time;
        starField.rotation.y = time * 0.0002;
        starField.position.copy(camera.position);
        const outside = Math.min(1, Math.max(0, (camera.position.distanceTo(GALAXY_CENTER) - GALAXY.radius * 1.05) / (GALAXY.radius * 0.6)));
        skyHaze.visible = outside < 0.5;
        milkyWay.userData.glow.visible = outside > 0.2;
        skyBandStars.material.opacity = 0.9 * (1 - outside);
        skyFaint.material.opacity = 0.55 * (1 - outside * 0.8);
        skySmall.material.opacity = 0.8 * (1 - outside * 0.7);
        sun.rotation.y = time * 0.05;
        planets.forEach((pl) => { pl.mesh.rotation.y = time * pl.spin * 0.3; });
        clouds.rotation.y = time * 0.2;
        moonPivot.rotation.y = time * 0.1;
        updaters.forEach((u) => u(time));

        if (isZooming) {
            controls.enabled = false;
            camera.position.lerp(zoomTarget, 0.05);
            lookTarget.copy(center);
            camera.lookAt(center);
            if (camera.position.distanceTo(zoomTarget) < 8) {
                blackSphere.visible = false;
                auraMesh.visible = false;
                instancedDisk.visible = false;
                showPhoto();
            }
        } else if (touring) {
            const stop = stops[tourList[tourIndex]];
            stop.obj.getWorldPosition(worldPos);
            camGoal.copy(worldPos).add(stop.offset);
            camera.position.lerp(camGoal, 0.025);
            lookTarget.lerp(worldPos, 0.06);
            camera.lookAt(lookTarget);
            if (!arrived && camera.position.distanceTo(camGoal) < stop.size * 0.4 + 0.5) {
                arrived = true;
                planetName.textContent = displayName(stop.id);
                planetName.classList.add('show');
                if (spaceEvents.onArrive) spaceEvents.onArrive(stop.id, stop);
                if (!stayAtEnd) holdUntil = time + tourHold;
            }
            const holdForever = stayAtEnd || (endStay && tourIndex === tourList.length - 1);
            if (arrived && !holdForever && time > holdUntil) {
                planetName.classList.remove('show');
                if (spaceEvents.onLeave) spaceEvents.onLeave();
                arrived = false;
                tourIndex++;
                if (tourIndex >= tourList.length) {
                    touring = false;
                    isReturning = true;
                    backBtn.style.display = 'none';
                }
            }
        } else if (isReturning) {
            blackSphere.visible = true;
            auraMesh.visible = true;
            instancedDisk.visible = true;
            camera.position.lerp(startPos, 0.04);
            lookTarget.lerp(center, 0.06);
            camera.lookAt(lookTarget);
            if (camera.position.distanceTo(startPos) < 1) {
                isReturning = false;
                controls.target.copy(center);
                controls.enabled = true;
                btn.style.display = 'block';
                spaceBtn.style.display = 'block';
            }
        } else {
            controls.update();
        }
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}
</script>

<script>
const guideBtn = document.getElementById('guideBtn');
const guide = document.getElementById('guide');
const guideBrowse = document.getElementById('guideBrowse');
const guideSearch = document.getElementById('guideSearch');
const guideCats = document.getElementById('guideCats');
const guideCount = document.getElementById('guideCount');
const guideList = document.getElementById('guideList');
const guideDetail = document.getElementById('guideDetail');
const infoCard = document.getElementById('infoCard');
let currentCat = 'all';
let infoItemId = null;

function iconFor(item) {
    const cat = SpaceDB.category(item.cat);
    return cat ? cat.icon : '✨';
}

function openGuide() {
    guide.classList.add('open');
    if (space3D) space3D.pause();
}

function closeGuide() {
    guide.classList.remove('open');
}

function renderCats() {
    const all = [{ id: 'all', name: 'All', icon: '✨' }, ...SpaceDB.categories];
    guideCats.innerHTML = all.map((c) =>
        `<button class="g-chip ${c.id === currentCat ? 'active' : ''}" data-cat="${c.id}">${c.icon} ${c.name} (${SpaceDB.count(c.id)})</button>`
    ).join('');
}

function renderList() {
    const results = SpaceDB.search(guideSearch.value, currentCat);
    guideCount.textContent = results.length + (results.length === 1 ? ' result' : ' results');
    if (results.length === 0) {
        guideList.innerHTML = '<div class="g-empty">Nothing found. Try another word.</div>';
        return;
    }
    guideList.innerHTML = results.map((item) =>
        `<div class="g-card" data-id="${item.id}">
            <div class="g-card-icon">${iconFor(item)}</div>
            <div>
                <div class="g-card-name">${item.name}</div>
                <div class="g-card-type">${item.type}</div>
            </div>
        </div>`
    ).join('');
}

function openDetail(id, highlight) {
    const item = SpaceDB.get(id);
    if (!item) return;
    const cat = SpaceDB.category(item.cat);
    const canFly = space3D && space3D.canFly(item.id);
    const stats = Object.entries(item.stats).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
    const facts = item.facts.map((f) => `<li>${f}</li>`).join('');
    guideDetail.innerHTML = `
        <div class="g-actions">
            <button class="g-btn" id="detailBack">← Back</button>
            ${canFly ? '<button class="g-btn fly" id="detailFly">🚀 Fly there</button>' : ''}
            ${space3D && space3D.hasTour(item.id) ? '<button class="g-btn tour" style="display:inline-block" id="detailTour">🌀 Go through it</button>' : ''}
        </div>
        <div class="g-type">${cat.icon} ${cat.name}</div>
        <h3>${item.name}</h3>
        <div class="g-type">${item.type}</div>
        ${highlight ? `<div class="g-highlight">💡 Did you know? ${highlight}</div>` : ''}
        <p class="g-summary">${item.summary}</p>
        <table class="g-stats">${stats}</table>
        <strong>Facts</strong>
        <ul class="g-facts">${facts}</ul>`;
    guideBrowse.style.display = 'none';
    guideDetail.style.display = 'block';
    guide.scrollTop = 0;
    document.getElementById('detailBack').addEventListener('click', closeDetail);
    if (canFly) {
        document.getElementById('detailFly').addEventListener('click', () => {
            goTo(item.id);
        });
    }
    const detailTour = document.getElementById('detailTour');
    if (detailTour) {
        detailTour.addEventListener('click', () => {
            closeGuide();
            hideGoto();
            space3D.galaxyTour(item.id);
        });
    }
}

function closeDetail() {
    guideDetail.style.display = 'none';
    guideBrowse.style.display = 'block';
}

function goTo(id) {
    closeGuide();
    hideGoto();
    if (space3D) space3D.flyTo(id);
    else {
        openGuide();
        openDetail(id);
    }
}

function showInfoCard(id, stop) {
    const item = SpaceDB.get(id);
    const infoText = document.getElementById('infoText');
    const infoTour = document.getElementById('infoTour');
    const tour = space3D ? space3D.tourInfo() : null;
    if (item) {
        infoItemId = item.id;
        document.getElementById('infoName').textContent = item.name;
        document.getElementById('infoType').textContent = item.type;
        document.getElementById('infoStats').innerHTML = Object.entries(item.stats).slice(0, 4)
            .map(([k, v]) => `<div><span>${k}:</span> ${v}</div>`).join('');
        infoText.textContent = '';
    } else if (stop && stop.label) {
        const galaxy = SpaceDB.get(stop.galaxy);
        infoItemId = stop.galaxy;
        document.getElementById('infoName').textContent = stop.label;
        document.getElementById('infoType').textContent = galaxy ? galaxy.type : '';
        document.getElementById('infoStats').innerHTML = '';
        infoText.textContent = stop.text;
    } else {
        return;
    }
    const offerTour = item && space3D && space3D.hasTour(item.id) && !(tour && tour.name === item.id && tour.index < tour.total - 1);
    infoTour.style.display = offerTour ? 'inline-block' : 'none';
    infoTour.dataset.id = offerTour ? item.id : '';
    document.getElementById('tourProgress').textContent = tour && tour.index < tour.total - 1
        ? `Going through ${SpaceDB.get(tour.name).name}: stop ${tour.index + 1} of ${tour.total - 1}`
        : '';
    infoCard.classList.add('show');
}

function hideInfoCard() {
    infoCard.classList.remove('show');
}

if (typeof SpaceDB === 'undefined') {
    guideBtn.style.display = 'none';
} else {
    renderCats();
    renderList();
    closeDetail();

    guideBtn.addEventListener('click', () => {
        if (guide.classList.contains('open')) closeGuide();
        else openGuide();
    });

    document.getElementById('guideClose').addEventListener('click', closeGuide);

    guideSearch.addEventListener('input', renderList);

    guideCats.addEventListener('click', (e) => {
        const chip = e.target.closest('.g-chip');
        if (!chip) return;
        currentCat = chip.dataset.cat;
        renderCats();
        renderList();
    });

    guideList.addEventListener('click', (e) => {
        const card = e.target.closest('.g-card');
        if (card) openDetail(card.dataset.id);
    });

    document.getElementById('guideRandom').addEventListener('click', () => {
        const pick = SpaceDB.randomFact();
        openDetail(pick.item.id, pick.fact);
    });

    document.getElementById('infoTour').addEventListener('click', (e) => {
        const id = e.currentTarget.dataset.id;
        if (id && space3D) {
            hideInfoCard();
            space3D.galaxyTour(id);
        }
    });

    document.getElementById('infoMore').addEventListener('click', () => {
        if (!infoItemId) return;
        openGuide();
        openDetail(infoItemId);
    });

    spaceEvents.onArrive = showInfoCard;
    spaceEvents.onLeave = hideInfoCard;
    spaceEvents.onPick = (id) => {
        const item = SpaceDB.get(id);
        if (!item) return;
        openGuide();
        openDetail(item.id);
    };
}
const gotoInput = document.getElementById('gotoInput');
const gotoList = document.getElementById('gotoList');
let gotoResults = [];
let gotoActive = 0;

function hideGoto() {
    gotoList.classList.remove('show');
    gotoInput.value = '';
    gotoInput.blur();
}

function renderGoto() {
    gotoResults = SpaceDB.suggest(gotoInput.value, 7);
    gotoActive = 0;
    if (gotoResults.length === 0) {
        gotoList.classList.remove('show');
        return;
    }
    const exact = gotoResults.filter((r) => !r.similar);
    const allFuzzy = exact.length > 0 && exact.every((r) => r.fuzzy);
    let html = allFuzzy ? '<div class="goto-head">Did you mean...</div>' : '';
    let shownSimilar = false;
    gotoResults.forEach((r, i) => {
        if (r.similar && !shownSimilar) {
            html += '<div class="goto-head">Similar places</div>';
            shownSimilar = true;
        }
        html += `<div class="goto-row ${i === gotoActive ? 'active' : ''}" data-index="${i}">
            <div class="goto-icon">${iconFor(r.item)}</div>
            <div class="goto-text">
                <div class="goto-name">${r.item.name}</div>
                <div class="goto-type">${r.item.type}</div>
            </div>
            <div class="goto-go">Go →</div>
        </div>`;
    });
    gotoList.innerHTML = html;
    gotoList.classList.add('show');
}

function highlightGoto() {
    gotoList.querySelectorAll('.goto-row').forEach((row) => {
        row.classList.toggle('active', Number(row.dataset.index) === gotoActive);
    });
}

if (typeof SpaceDB === 'undefined') {
    document.getElementById('goto').style.display = 'none';
} else {
    gotoInput.addEventListener('input', renderGoto);

    gotoInput.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown' && gotoResults.length) {
            gotoActive = (gotoActive + 1) % gotoResults.length;
            highlightGoto();
            e.preventDefault();
        } else if (e.key === 'ArrowUp' && gotoResults.length) {
            gotoActive = (gotoActive - 1 + gotoResults.length) % gotoResults.length;
            highlightGoto();
            e.preventDefault();
        } else if (e.key === 'Enter' && gotoResults.length) {
            goTo(gotoResults[gotoActive].item.id);
        } else if (e.key === 'Escape') {
            hideGoto();
        }
    });

    gotoList.addEventListener('mousedown', (e) => {
        const row = e.target.closest('.goto-row');
        if (!row) return;
        e.preventDefault();
        goTo(gotoResults[Number(row.dataset.index)].item.id);
    });

    gotoInput.addEventListener('blur', () => {
        setTimeout(() => gotoList.classList.remove('show'), 150);
    });

    gotoInput.addEventListener('focus', () => {
        if (gotoInput.value) renderGoto();
    });
}
</script>

<script>
(() => {
    const missing = [];
    if (typeof SpaceDB === 'undefined') missing.push('space-data.js');
    if (typeof SpaceVisuals === 'undefined') missing.push('space-visuals.js');
    if (typeof THREE === 'undefined') missing.push('the internet connection (Three.js)');
    if (missing.length) {
        const box = document.getElementById('fileWarning');
        box.textContent = 'Missing: ' + missing.join(', ') + '. Put the file in the same folder as index.html with exactly this name (no (1) or (2) in it).';
        box.hidden = false;
    }
})();
</script>
